services:
  - type: web
    name: foodcourt-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
